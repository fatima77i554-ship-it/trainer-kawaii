<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e4ddf4">
<title>Тренер Лизи</title>
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<script>
// iPhone/iPad: страницу уменьшает сам iOS через viewport, без CSS zoom — в iOS-движке zoom
// не действует на размеры шрифта, заданные через calc(), и текст оставался огромным.
// Базы должны совпадать с src/density.ts.
(function () {
  var ua = navigator.userAgent, tg = window.Telegram && window.Telegram.WebApp;
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) || (tg && tg.platform === 'ios');
  if (!ios) return;
  var sizes = { small: 840, medium: 720, large: 620 }, key = new URLSearchParams(location.search).get('density');
  if (!sizes[key]) { try { key = localStorage.getItem('trainer_kawaii_size'); } catch (e) { key = null; } }
  var base = sizes[key] || 620;
  if (Math.min(screen.width, screen.height) >= base) return;
  document.querySelector('meta[name=viewport]').setAttribute('content', 'width=' + base + ', user-scalable=no, viewport-fit=cover');
  document.documentElement.setAttribute('data-vp', 'native');
})();
</script>
<!--CSS-->
</head>
<body>
<div id="root"></div>
<!--JS-->
</body>
</html>
